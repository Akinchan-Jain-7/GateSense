[project]
name = "gatesense-backend"
version = "0.1.0"
description = "GateSense API: gate events, visits, approvals and escalation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20.1",
  "argon2-cffi>=25.1.0",
  "boto3>=1.44.9",
  "celery[redis]>=5.7.0",
  "email-validator>=2.4.0",
  "fastapi>=0.165.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.9",
  "pydantic-settings>=2.16.3",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.34",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.1.9",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.44.9",
  "httpx2>=2.16.2",
  "moto>=5.2.5",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.6",
]

[tool.uv]
# The backend is an application, not a library we publish.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole run, so the database engine can be shared by every test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async API runs database code inside greenlets; without this,
# coverage misses every line that runs after an `await db...` call.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Celery ships without type hints.
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
