name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres and Redis for the tests, started next to the job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gatesense
          POSTGRES_PASSWORD: gatesense_ci_password
          POSTGRES_DB: gatesense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatesense" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://gatesense:gatesense_ci_password@localhost:5432/gatesense
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest (with coverage)
        run: uv run pytest --cov --cov-report=term-missing

  backend-windows:
    # The owner develops on Windows, where asyncio's default loop differs from Linux.
    # This runs the migration, the seed script and the unit tests on a real Windows
    # machine, using the PostgreSQL that GitHub's Windows images ship with.
    name: Backend on Windows (migrate, seed, unit tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/gatesense
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Start the preinstalled PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -Status Running -StartupType Automatic
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres gatesense
        env:
          PGPASSWORD: root
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate (sync driver)
        run: uv run alembic upgrade head
      - name: Seed demo data (async driver, event loop fix)
        run: uv run python -m app.seed
      - name: Unit tests (Redis-backed debounce tests run on Linux only)
        run: uv run pytest tests/unit --deselect tests/unit/test_debounce.py -p no:cacheprovider

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack and wait for every healthcheck
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Show service status
        run: docker compose ps
      - name: Smoke-test the endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS -o /dev/null http://127.0.0.1:5173/
          curl -fsS -o /dev/null http://127.0.0.1:8025/
          curl -fsS http://127.0.0.1:9000/health
      - name: Seed demo data and log in (the README quick start)
        run: |
          docker compose exec -T backend python -m app.seed | tee seed-output.txt
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -d "username=admin@example.com&password=GateSense@123" -o /dev/null
      - name: Camera read with a snapshot, stored in S3 storage and read back
        run: |
          KEY=$(grep "Main Gate - entry camera:" seed-output.txt | awk '{print $NF}')
          printf '\xff\xd8\xff\xe0compose-smoke-test' > car.jpg
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/gate-events \
            -H "X-Device-Key: $KEY" -F plate_text=DL01AB1234 -F confidence=0.95 \
            -F "snapshot=@car.jpg;type=image/jpeg" -o event.json
          cat event.json && echo
          EVENT=$(python3 -c "import json; print(json.load(open('event.json'))['event']['id'])")
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -d "username=guard@example.com&password=GateSense@123" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" -o back.jpg \
            "http://127.0.0.1:8000/api/v1/gate-events/$EVENT/snapshot"
          cmp car.jpg back.jpg && echo "snapshot round trip through S3 storage: OK"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lets the action list the commits in a PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # commenting would need write access
