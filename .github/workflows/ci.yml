name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres and Redis for the tests, started next to the job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gatesense
          POSTGRES_PASSWORD: gatesense_ci_password
          POSTGRES_DB: gatesense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatesense" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://gatesense:gatesense_ci_password@localhost:5432/gatesense
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest (with coverage)
        run: uv run pytest --cov --cov-report=term-missing

  backend-windows:
    # The owner develops on Windows, where asyncio's default loop differs from Linux.
    # This runs the migration, the seed script and the unit tests on a real Windows
    # machine, using the PostgreSQL that GitHub's Windows images ship with.
    name: Backend on Windows (migrate, seed, unit tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/gatesense
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Start the preinstalled PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -Status Running -StartupType Automatic
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U postgres gatesense
        env:
          PGPASSWORD: root
      - name: Install dependencies
        run: uv sync --frozen
      - name: Migrate (sync driver)
        run: uv run alembic upgrade head
      - name: Seed demo data (async driver, event loop fix)
        run: uv run python -m app.seed
      - name: Unit tests (Redis-backed debounce tests run on Linux only)
        run: uv run pytest tests/unit --deselect tests/unit/test_debounce.py -p no:cacheprovider

  anpr:
    name: ANPR worker (lint, types, tests, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anpr
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: Build the worker image and run a simulated camera
        run: |
          docker build -t gatesense-anpr .
          docker run --rm gatesense-anpr gatesense-anpr --simulate 3 --dry-run --seed 1

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests (with coverage threshold)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gatesense
          POSTGRES_PASSWORD: gatesense_ci_password
          POSTGRES_DB: gatesense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatesense" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gatesense:gatesense_ci_password@localhost:5432/gatesense
      REDIS_URL: redis://localhost:6379/0
      DEMO_MODE: "true"
      SNAPSHOT_STORAGE: local
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && uv sync --frozen)
          (cd frontend && npm ci)
      - name: Frontend API types match the backend
        run: |
          (cd backend && uv run python ../scripts/export_openapi.py)
          (cd frontend && npm run api:types)
          git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts \
            || (echo "::error::Run the export script and npm run api:types, then commit" && exit 1)
      - name: Migrate and seed the demo society
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python -m app.seed --reset
      - name: Start the API and the built web app
        run: |
          (cd backend && nohup uv run uvicorn app.main:app --port 8000 > ../api.log 2>&1 &)
          (cd frontend && npm run build && (nohup npx vite preview --port 4173 > ../web.log 2>&1 &))
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/api/v1/demo
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the three journeys
        working-directory: frontend
        run: npm run e2e
      - name: Logs and report on failure
        if: failure()
        run: |
          cat api.log web.log || true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  compose:
    name: Docker Compose stack starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack and wait for every healthcheck
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Show service status
        run: docker compose ps
      - name: Smoke-test the endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS -o /dev/null http://127.0.0.1:5173/
          curl -fsS http://127.0.0.1:5173/api/v1/demo  # the web app's proxy reaches the API
          curl -fsS -o /dev/null http://127.0.0.1:8025/
          curl -fsS http://127.0.0.1:9000/health
      - name: Seed demo data and log in (the README quick start)
        run: |
          docker compose exec -T backend python -m app.seed | tee seed-output.txt
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -d "username=admin@example.com&password=GateSense@123" -o /dev/null
      - name: Camera read with a snapshot, stored in S3 storage and read back
        run: |
          KEY=$(grep "Main Gate - entry camera:" seed-output.txt | awk '{print $NF}')
          printf '\xff\xd8\xff\xe0compose-smoke-test' > car.jpg
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/gate-events \
            -H "X-Device-Key: $KEY" -F plate_text=DL01AB1234 -F confidence=0.95 \
            -F "snapshot=@car.jpg;type=image/jpeg" -o event.json
          cat event.json && echo
          EVENT=$(python3 -c "import json; print(json.load(open('event.json'))['event']['id'])")
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -d "username=guard@example.com&password=GateSense@123" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $TOKEN" -o back.jpg \
            "http://127.0.0.1:8000/api/v1/gate-events/$EVENT/snapshot"
          cmp car.jpg back.jpg && echo "snapshot round trip through S3 storage: OK"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  simulator:
    name: Simulator (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  compose-prod:
    name: Production stack (images, Caddy, simulator)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml --env-file .env.prod
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env.prod (plain HTTP on :80, demo mode, simulator on)
        run: |
          cp .env.prod.example .env.prod
          sed -i "s#^SITE_ADDRESS=.*#SITE_ADDRESS=:80#; s#^PUBLIC_BASE_URL=.*#PUBLIC_BASE_URL=http://localhost#" .env.prod
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=$(openssl rand -hex 16)#" .env.prod
          sed -i "s#^JWT_SECRET_KEY=.*#JWT_SECRET_KEY=$(openssl rand -hex 32)#" .env.prod
          sed -i "s#^DEMO_MODE=.*#DEMO_MODE=true#; s#^COMPOSE_PROFILES=.*#COMPOSE_PROFILES=demo#" .env.prod
          sed -i "s#^SIM_SPEED=.*#SIM_SPEED=20#; s#^IMAGE_TAG=.*#IMAGE_TAG=ci#" .env.prod
      - name: Build the production images
        run: |
          $COMPOSE build
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | grep gatesense
      - name: Check the Caddyfile
        run: docker run --rm -e SITE_ADDRESS=:80 ghcr.io/akinchan-jain-7/gatesense-frontend:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Start the stack
        run: |
          $COMPOSE up --detach
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1/health && break; sleep 2; done
          $COMPOSE ps
      - name: Smoke-test through Caddy, the only published port
        run: |
          set -x
          curl -fsS http://127.0.0.1/ready
          curl -fsS http://127.0.0.1/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1/admin/visits | grep -q '<div id="root">'  # app routes
          curl -fsS http://127.0.0.1/api/v1/demo | grep -q '"enabled":true'
          curl -fsSI http://127.0.0.1/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://127.0.0.1/assets/ | grep -qi "x-content-type-options: nosniff"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/metrics)" = 404
          curl -fsS -o /dev/null http://127.0.0.1/docs
          ! curl -fsS -m 3 http://127.0.0.1:8000/health  # the API itself is not published
          curl -fsS -X POST http://127.0.0.1/api/v1/auth/login \
            -d "username=admin@example.com&password=GateSense@123" -o /dev/null
      - name: Containers run as non-root users
        run: |
          for s in api worker web simulator; do
            uid=$($COMPOSE exec -T $s id -u); echo "$s: uid $uid"; test "$uid" != 0
          done
      - name: The simulator makes traffic, and the worker and beat are alive
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1/api/v1/auth/login \
            -d "username=guard@example.com&password=GateSense@123" \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['access_token'])")
          count() {
            curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1/api/v1/gate-events?limit=1" \
              | python3 -c "import json, sys; print(json.load(sys.stdin)['total'])"
          }
          before=$(count); sleep 60; after=$(count)
          echo "gate events: $before -> $after"; test "$after" -gt "$before"
          $COMPOSE exec -T worker celery -A app.workers.celery_app inspect ping --timeout 10
          $COMPOSE logs beat | grep -q "beat: Starting"
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop the stack
        if: always()
        run: $COMPOSE down --volumes

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lets the action list the commits in a PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # commenting would need write access
