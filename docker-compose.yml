# GateSense local development stack.
#
#   cp .env.example .env      # once
#   docker compose up --build # start everything
#
# Every port is bound to 127.0.0.1, so nothing is exposed to your network.
# Values come from .env, with safe local defaults after ":-".

name: gatesense

services:
  # --- Infrastructure -------------------------------------------------------

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatesense_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gatesense}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in a versioned subfolder of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    # Catches every email the app sends; read them at http://localhost:8025
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    # S3-compatible object storage for plate snapshots.
    # RustFS replaces MinIO, whose official images are no longer published
    # (see docs/adr/0002-dev-object-storage.md). Console: http://localhost:9001
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-gatesense}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-gatesense_dev_secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- Application -----------------------------------------------------------

  backend:
    build: { context: ./backend, target: dev }
    environment: &backend-env
      # Inside the Compose network, services reach each other by service name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gatesense}:${POSTGRES_PASSWORD:-gatesense_dev_password}@postgres:5432/${POSTGRES_DB:-gatesense}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-jwt-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SNAPSHOT_STORAGE: ${SNAPSHOT_STORAGE:-s3}
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gatesense}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gatesense_dev_secret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Live-reload: code edits on your machine show up inside the container.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Background jobs (approval timeouts, Telegram messages; more in Phase 5).
  worker:
    build: { context: ./backend, target: dev }
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Puts scheduled jobs on the queue: escalation + email dispatch every minute, nightly
  # reconciliation, daily retention purge. Exactly one beat process may run.
  beat:
    build: { context: ./backend, target: dev }
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      worker:
        condition: service_healthy

  frontend:
    build: { context: ./frontend, target: dev }
    environment:
      # The dev server forwards /api (and the WebSocket) to the backend container.
      VITE_API_PROXY: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  storage-data:
