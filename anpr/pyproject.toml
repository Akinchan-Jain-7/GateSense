[project]
name = "gatesense-anpr"
version = "0.1.0"
description = "GateSense ANPR worker: plate detector (YOLOv8 on ONNX Runtime) + OCR, posting gate events to the API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.2",
    "onnxruntime>=1.22",
    "opencv-python-headless>=4.11",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
# OCR engines are big (PyTorch / PaddlePaddle), so they are opt-in:
#   uv sync --extra easyocr    or    uv sync --extra paddleocr
easyocr = ["easyocr>=1.7"]
paddleocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]

[project.scripts]
gatesense-anpr = "gatesense_anpr.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "onnx>=1.18",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatesense_anpr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gatesense_anpr", "eval"]

[tool.coverage.report]
# CI fails below this (Phase 7). Currently ~87%; model code needing real weights is
# covered by the evaluation scripts instead.
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gatesense_anpr", "eval", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "onnxruntime.*", "easyocr.*", "paddleocr.*", "onnx.*"]
ignore_missing_imports = true
